<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNEC Admin Panel</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f1117;
      --surface:  #1a1d27;
      --surface2: #232635;
      --border:   #2e3347;
      --accent:   #6366f1;
      --accent2:  #818cf8;
      --text:     #e8eaf0;
      --muted:    #8b8fa8;
      --green:    #22c55e;
      --red:      #ef4444;
      --yellow:   #f59e0b;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    /* ── Login screen ─── */
    #login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .login-logo {
      font-size: 2.5rem;
      margin-bottom: 8px;
    }
    .login-title {
      font-size: 1.3rem;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .login-sub {
      color: var(--muted);
      font-size: .82rem;
      margin-bottom: 28px;
    }
    .login-input {
      width: 100%;
      padding: 13px 16px;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: .95rem;
      outline: none;
      margin-bottom: 12px;
      transition: border-color .18s;
      text-align: center;
      letter-spacing: .1em;
    }
    .login-input:focus { border-color: var(--accent); }
    .login-btn {
      width: 100%;
      padding: 13px;
      background: var(--accent);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .18s;
    }
    .login-btn:hover { opacity: .88; }
    .login-error {
      color: var(--red);
      font-size: .8rem;
      margin-top: 10px;
      min-height: 18px;
    }

    /* ── App layout ─── */
    #app { display: none; }

    .sidebar {
      position: fixed;
      left: 0; top: 0; bottom: 0;
      width: 220px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 100;
    }
    .sidebar-logo {
      font-size: 1rem;
      font-weight: 800;
      color: var(--text);
      padding: 0 8px 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 8px;
    }
    .sidebar-logo span { color: var(--accent); }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: .85rem;
      font-weight: 600;
      color: var(--muted);
      transition: all .18s;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
    }
    .nav-item:hover { background: var(--surface2); color: var(--text); }
    .nav-item.active { background: rgba(99,102,241,.15); color: var(--accent); }
    .nav-item .ni { font-size: 1.1rem; }
    .sidebar-bottom {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .logout-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: .82rem;
      font-weight: 600;
      color: var(--red);
      border: none;
      background: transparent;
      width: 100%;
    }
    .logout-btn:hover { background: rgba(239,68,68,.08); }

    .main-content {
      margin-left: 220px;
      padding: 28px;
      min-height: 100vh;
    }

    /* ── Topbar ─── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }
    .page-title {
      font-size: 1.4rem;
      font-weight: 800;
    }
    .refresh-btn {
      padding: 8px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      font-size: .8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .18s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Tab panels ─── */
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Summary cards ─── */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }
    .summary-val {
      font-size: 2rem;
      font-weight: 900;
      color: var(--text);
    }
    .summary-lbl {
      font-size: .72rem;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .07em;
      margin-top: 4px;
    }
    .summary-card .accent { color: var(--accent); }
    .summary-card .green  { color: var(--green); }
    .summary-card .yellow { color: var(--yellow); }
    .summary-card .red    { color: var(--red); }

    /* ── Section ─── */
    .section { margin-bottom: 32px; }
    .section-title {
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    /* ── Table ─── */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .83rem;
    }
    thead {
      background: var(--surface2);
    }
    th {
      padding: 12px 16px;
      text-align: left;
      font-size: .68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--muted);
      white-space: nowrap;
    }
    td {
      padding: 11px 16px;
      border-top: 1px solid var(--border);
      color: var(--text);
    }
    tr:hover td { background: var(--surface2); }
    .td-muted { color: var(--muted); font-size: .78rem; }
    .td-bold { font-weight: 700; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: .7rem;
      font-weight: 700;
    }
    .badge-green  { background: rgba(34,197,94,.15);  color: var(--green); }
    .badge-yellow { background: rgba(245,158,11,.15); color: var(--yellow); }
    .badge-red    { background: rgba(239,68,68,.15);  color: var(--red); }
    .badge-blue   { background: rgba(99,102,241,.15); color: var(--accent2); }
    .badge-gray   { background: var(--surface2); color: var(--muted); }

    /* ── Bar chart ─── */
    .bar-chart {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }
    .bar-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .bar-row:last-child { margin-bottom: 0; }
    .bar-name {
      width: 180px;
      font-size: .78rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex-shrink: 0;
    }
    .bar-track {
      flex: 1;
      height: 8px;
      background: var(--surface2);
      border-radius: 20px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 20px;
      transition: width .5s;
    }
    .bar-count {
      width: 36px;
      text-align: right;
      font-size: .78rem;
      font-weight: 700;
      color: var(--muted);
      flex-shrink: 0;
    }

    /* ── Chat messages ─── */
    .chat-subject-group {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .chat-subject-header {
      padding: 14px 18px;
      background: var(--surface2);
      font-weight: 700;
      font-size: .88rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }
    .chat-subject-header:hover { background: var(--border); }
    .chat-msg-list { display: none; }
    .chat-msg-list.open { display: block; }
    .chat-msg {
      padding: 12px 18px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .chat-msg:hover { background: var(--surface2); }
    .chat-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .75rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    .chat-msg-body { flex: 1; }
    .chat-msg-meta {
      font-size: .7rem;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .chat-msg-meta strong { color: var(--text); }
    .chat-msg-text {
      font-size: .83rem;
      color: var(--text);
      line-height: 1.45;
    }
    .chat-msg.deleted .chat-msg-text {
      color: var(--muted);
      font-style: italic;
    }

    /* ── Search bar ─── */
    .search-bar {
      width: 100%;
      padding: 11px 16px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: .85rem;
      outline: none;
      margin-bottom: 16px;
      transition: border-color .18s;
    }
    .search-bar:focus { border-color: var(--accent); }

    /* ── Loading ─── */
    .loading {
      padding: 48px;
      text-align: center;
      color: var(--muted);
      font-size: .9rem;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ─── */
    @media (max-width: 768px) {
      .sidebar { width: 60px; padding: 16px 8px; }
      .sidebar-logo, .nav-item span, .logout-btn span { display: none; }
      .nav-item { justify-content: center; padding: 12px; }
      .main-content { margin-left: 60px; padding: 16px; }
      .bar-name { width: 100px; }
    }
  </style>
</head>
<body>

<!-- ── LOGIN ─────────────────────────────────────────────────── -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">🛡️</div>
    <div class="login-title">Admin Panel</div>
    <div class="login-sub">UNEC Tələbə Platforması</div>
    <input class="login-input" id="admin-key-input"
           type="password" placeholder="Admin kodu"
           onkeydown="if(event.key==='Enter') doLogin()">
    <button class="login-btn" onclick="doLogin()">Daxil ol</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ── APP ───────────────────────────────────────────────────── -->
<div id="app">

  <div class="sidebar">
    <div class="sidebar-logo">🛡️ <span>UNEC</span> Admin</div>

    <button class="nav-item active" onclick="showTab('overview')" id="nav-overview">
      <span class="ni">📊</span><span>Ümumi baxış</span>
    </button>
    <button class="nav-item" onclick="showTab('users')" id="nav-users">
      <span class="ni">👥</span><span>İstifadəçilər</span>
    </button>
    <button class="nav-item" onclick="showTab('chats')" id="nav-chats">
      <span class="ni">💬</span><span>Chat mesajları</span>
    </button>
    <button class="nav-item" onclick="showTab('requests')" id="nav-requests">
      <span class="ni">📋</span><span>Material istəkləri</span>
    </button>
    <button class="nav-item" onclick="showTab('pdfs')" id="nav-pdfs">
      <span class="ni">📄</span><span>PDF statistika</span>
    </button>

    <div class="sidebar-bottom">
      <button class="logout-btn" onclick="doLogout()">
        <span>🚪</span><span>Çıxış</span>
      </button>
    </div>
  </div>

  <div class="main-content">
    <div class="topbar">
      <div class="page-title" id="page-title">Ümumi baxış</div>
      <button class="refresh-btn" onclick="refreshCurrent()">🔄 Yenilə</button>
    </div>

    <!-- OVERVIEW -->
    <div class="tab-panel active" id="panel-overview">
      <div id="overview-content"><div class="loading"><div class="spinner"></div>Yüklənir...</div></div>
    </div>

    <!-- USERS -->
    <div class="tab-panel" id="panel-users">
      <input class="search-bar" id="users-search" placeholder="Ad, email, fakültə axtar..." oninput="filterUsers()">
      <div id="users-content"><div class="loading"><div class="spinner"></div>Yüklənir...</div></div>
    </div>

    <!-- CHATS -->
    <div class="tab-panel" id="panel-chats">
      <input class="search-bar" id="chats-search" placeholder="Mesaj, istifadəçi axtar..." oninput="filterChats()">
      <div id="chats-content"><div class="loading"><div class="spinner"></div>Yüklənir...</div></div>
    </div>

    <!-- REQUESTS -->
    <div class="tab-panel" id="panel-requests">
      <input class="search-bar" id="requests-search" placeholder="İstək axtar..." oninput="filterRequests()">
      <div id="requests-content"><div class="loading"><div class="spinner"></div>Yüklənir...</div></div>
    </div>

    <!-- PDFS -->
    <div class="tab-panel" id="panel-pdfs">
      <div id="pdfs-content"><div class="loading"><div class="spinner"></div>Yüklənir...</div></div>
    </div>

  </div>
</div>

<script>
// ── Config ─────────────────────────────────────────────────────
const API = 'https://ericismyhero-github-io.vercel.app/api/admin-data';

// ── State ──────────────────────────────────────────────────────
let adminKey = '';
let currentTab = 'overview';
let cache = {};

// ── Auth ───────────────────────────────────────────────────────
async function doLogin() {
  const key = document.getElementById('admin-key-input').value.trim();
  if (!key) return;

  const errEl = document.getElementById('login-error');
  errEl.textContent = 'Yoxlanılır...';

  try {
    const res = await apiFetch('all', key);
    if (res.error) throw new Error(res.error);

    adminKey = key;
    cache['overview'] = res;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    renderOverview(res);
  } catch (e) {
    errEl.textContent = e.message === 'Səlahiyyətsiz giriş' ? 'Yanlış kod.' : 'Xəta: ' + e.message;
  }
}

function doLogout() {
  adminKey = '';
  cache = {};
  document.getElementById('admin-key-input').value = '';
  document.getElementById('login-error').textContent = '';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

// ── API ────────────────────────────────────────────────────────
async function apiFetch(section, key) {
  const k = key || adminKey;
  const res = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Admin-Key': k },
    body: JSON.stringify({ section, adminKey: k }),
  });
  return res.json();
}

// ── Tab navigation ─────────────────────────────────────────────
const TAB_TITLES = {
  overview: 'Ümumi baxış',
  users:    'İstifadəçilər',
  chats:    'Chat mesajları',
  requests: 'Material istəkləri',
  pdfs:     'PDF statistika',
};

async function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('nav-' + tab).classList.add('active');
  document.getElementById('panel-' + tab).classList.add('active');
  document.getElementById('page-title').textContent = TAB_TITLES[tab];

  if (cache[tab]) {
    renderTab(tab, cache[tab]);
    return;
  }
  await loadTab(tab);
}

async function loadTab(tab) {
  const section = tab === 'overview' ? 'all' : tab;
  document.getElementById(tab + '-content').innerHTML =
    '<div class="loading"><div class="spinner"></div>Yüklənir...</div>';
  try {
    const data = await apiFetch(section);
    if (data.error) throw new Error(data.error);
    cache[tab] = data;
    renderTab(tab, data);
  } catch (e) {
    document.getElementById(tab + '-content').innerHTML =
      `<div class="loading" style="color:var(--red)">Xəta: ${e.message}</div>`;
  }
}

function refreshCurrent() {
  delete cache[currentTab];
  loadTab(currentTab);
}

function renderTab(tab, data) {
  if (tab === 'overview')  renderOverview(data);
  if (tab === 'users')     renderUsers(data.users);
  if (tab === 'chats')     renderChats(data.chats);
  if (tab === 'requests')  renderRequests(data.requests);
  if (tab === 'pdfs')      renderPdfs(data);
}

// ── OVERVIEW ───────────────────────────────────────────────────
function renderOverview(data) {
  const s = data.summary || {};
  const html = `
    <div class="summary-grid">
      <div class="summary-card">
        <div class="summary-val accent">${s.totalUsers || 0}</div>
        <div class="summary-lbl">Ümumi istifadəçi</div>
      </div>
      <div class="summary-card">
        <div class="summary-val green">${s.activeToday || 0}</div>
        <div class="summary-lbl">Bu gün aktiv</div>
      </div>
      <div class="summary-card">
        <div class="summary-val yellow">${s.totalRequests || 0}</div>
        <div class="summary-lbl">Material istəkləri</div>
      </div>
      <div class="summary-card">
        <div class="summary-val red">${s.openRequests || 0}</div>
        <div class="summary-lbl">Açıq istəklər</div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Ən çox açılan PDF-lər (son 500 açılış)</div>
      ${renderBarChart(data.pdfOpens || [], 8)}
    </div>

    <div class="section">
      <div class="section-title">Ən aktiv istifadəçilər (XP sırası)</div>
      ${renderTopUsersTable(data.topUsers || [])}
    </div>

    <div class="section">
      <div class="section-title">Son material istəkləri</div>
      ${renderRequestsTable((data.requests || []).slice(0, 8))}
    </div>
  `;
  document.getElementById('overview-content').innerHTML = html;
}

function renderBarChart(items, limit) {
  if (!items.length) return '<div class="loading">Məlumat yoxdur.</div>';
  const top = items.slice(0, limit);
  const max = top[0]?.count || 1;
  return `<div class="bar-chart">${top.map(item => `
    <div class="bar-row">
      <div class="bar-name" title="${esc(item.name)}">${esc(item.name)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(item.count/max*100)}%"></div></div>
      <div class="bar-count">${item.count}</div>
    </div>`).join('')}</div>`;
}

function renderTopUsersTable(users) {
  if (!users.length) return '<div class="loading">İstifadəçi yoxdur.</div>';
  return `<div class="table-wrap"><table>
    <thead><tr>
      <th>#</th><th>Ad</th><th>Email</th><th>Fakültə</th><th>XP</th><th>Streak</th><th>Testlər</th><th>Son giriş</th>
    </tr></thead>
    <tbody>${users.slice(0, 10).map((u, i) => `
      <tr>
        <td class="td-muted">${i+1}</td>
        <td class="td-bold">${esc(u.name)}</td>
        <td class="td-muted">${esc(u.email)}</td>
        <td class="td-muted">${esc(u.faculty || '—')}</td>
        <td><span class="badge badge-blue">${u.xp} XP</span></td>
        <td><span class="badge ${u.streak > 5 ? 'badge-green' : 'badge-gray'}">${u.streak} 🔥</span></td>
        <td class="td-muted">${u.totalTests || 0}</td>
        <td class="td-muted">${fmtDate(u.lastLogin)}</td>
      </tr>`).join('')}
    </tbody></table></div>`;
}

// ── USERS ──────────────────────────────────────────────────────
let _allUsers = [];

function renderUsers(users) {
  _allUsers = users || [];
  document.getElementById('users-content').innerHTML = buildUsersTable(_allUsers);
}

function filterUsers() {
  const q = document.getElementById('users-search').value.toLowerCase();
  const filtered = _allUsers.filter(u =>
    (u.name+u.email+u.faculty+u.major).toLowerCase().includes(q));
  document.getElementById('users-content').innerHTML = buildUsersTable(filtered);
}

function buildUsersTable(users) {
  if (!users.length) return '<div class="loading">İstifadəçi tapılmadı.</div>';
  return `<div class="table-wrap"><table>
    <thead><tr>
      <th>Ad</th><th>Email</th><th>Fakültə / İxtisas</th><th>Kurs</th>
      <th>XP</th><th>Streak</th><th>Testlər</th><th>Qeydiyyat</th><th>Son giriş</th>
    </tr></thead>
    <tbody>${users.map(u => `
      <tr>
        <td class="td-bold">${esc(u.name)}</td>
        <td class="td-muted">${esc(u.email)}</td>
        <td class="td-muted">${esc(u.faculty||'—')} / ${esc(u.major||'—')}</td>
        <td class="td-muted">${u.year || '—'}</td>
        <td><span class="badge badge-blue">${u.xp} XP</span></td>
        <td><span class="badge ${u.streak > 5 ? 'badge-green' : 'badge-gray'}">${u.streak} 🔥</span></td>
        <td class="td-muted">${u.totalTests || 0}</td>
        <td class="td-muted">${fmtDate(u.createdAt)}</td>
        <td class="td-muted">${fmtDate(u.lastLogin)}</td>
      </tr>`).join('')}
    </tbody></table></div>`;
}

// ── CHATS ──────────────────────────────────────────────────────
let _allChats = [];

function renderChats(chats) {
  _allChats = chats || [];
  document.getElementById('chats-content').innerHTML = buildChatsHtml(_allChats);
}

function filterChats() {
  const q = document.getElementById('chats-search').value.toLowerCase();
  const filtered = _allChats.map(group => ({
    ...group,
    messages: group.messages.filter(m =>
      (m.text + m.userName + m.userEmail).toLowerCase().includes(q))
  })).filter(g => g.messages.length > 0);
  document.getElementById('chats-content').innerHTML = buildChatsHtml(filtered);
}

function buildChatsHtml(chats) {
  if (!chats.length) return '<div class="loading">Chat tapılmadı.</div>';
  return chats.map((group, gi) => `
    <div class="chat-subject-group">
      <div class="chat-subject-header" onclick="toggleChatGroup(${gi})">
        <span>💬 ${esc(group.subject)}</span>
        <span class="badge badge-blue">${group.count} mesaj</span>
      </div>
      <div class="chat-msg-list" id="chatgroup-${gi}">
        ${group.messages.map(m => `
          <div class="chat-msg ${m.deleted ? 'deleted' : ''}">
            <div class="chat-avatar">${(m.userName||'?')[0].toUpperCase()}</div>
            <div class="chat-msg-body">
              <div class="chat-msg-meta">
                <strong>${esc(m.userName)}</strong>
                · ${esc(m.userEmail)}
                · ${fmtDate(m.ts)}
                ${m.deleted ? '· <span style="color:var(--red)">Silindi</span>' : ''}
              </div>
              <div class="chat-msg-text">${esc(m.text)}</div>
            </div>
          </div>`).join('')}
      </div>
    </div>`).join('');
}

function toggleChatGroup(gi) {
  const el = document.getElementById('chatgroup-' + gi);
  el.classList.toggle('open');
}

// ── REQUESTS ───────────────────────────────────────────────────
let _allRequests = [];

function renderRequests(requests) {
  _allRequests = requests || [];
  document.getElementById('requests-content').innerHTML = buildRequestsTable(_allRequests);
}

function filterRequests() {
  const q = document.getElementById('requests-search').value.toLowerCase();
  const filtered = _allRequests.filter(r =>
    (r.text + r.userName + r.userEmail).toLowerCase().includes(q));
  document.getElementById('requests-content').innerHTML = buildRequestsTable(filtered);
}

function renderRequestsTable(requests) {
  return buildRequestsTable(requests);
}

function buildRequestsTable(requests) {
  if (!requests.length) return '<div class="loading">İstək tapılmadı.</div>';
  return `<div class="table-wrap"><table>
    <thead><tr>
      <th>İstək</th><th>İstifadəçi</th><th>Upvote</th><th>Status</th><th>Tarix</th>
    </tr></thead>
    <tbody>${requests.map(r => `
      <tr>
        <td class="td-bold">${esc(r.text)}</td>
        <td class="td-muted">${esc(r.userName)} <br><small>${esc(r.userEmail)}</small></td>
        <td><span class="badge badge-blue">▲ ${r.upvotes}</span></td>
        <td><span class="badge ${r.found ? 'badge-green' : 'badge-yellow'}">${r.found ? 'Tapıldı' : 'Açıq'}</span></td>
        <td class="td-muted">${fmtDate(r.createdAt)}</td>
      </tr>`).join('')}
    </tbody></table></div>`;
}

// ── PDFS ───────────────────────────────────────────────────────
function renderPdfs(data) {
  const opens   = data.pdfOpens   || [];
  const ratings = data.pdfRatings || [];
  const html = `
    <div class="section">
      <div class="section-title">Ən çox açılan PDF-lər</div>
      ${renderBarChart(opens, 20)}
    </div>
    <div class="section">
      <div class="section-title">PDF reytinqləri (səs sayına görə)</div>
      ${ratings.length ? `<div class="table-wrap"><table>
        <thead><tr><th>PDF ID</th><th>Ortalama reytinq</th><th>Səs sayı</th></tr></thead>
        <tbody>${ratings.map(r => `
          <tr>
            <td class="td-bold">${esc(r.id)}</td>
            <td><span class="badge badge-yellow">${Number(r.avgRating).toFixed(1)} ⭐</span></td>
            <td class="td-muted">${r.totalVotes} səs</td>
          </tr>`).join('')}
        </tbody></table></div>` : '<div class="loading">Reytinq yoxdur.</div>'}
    </div>
  `;
  document.getElementById('pdfs-content').innerHTML = html;
}

// ── Helpers ────────────────────────────────────────────────────
function esc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('az-AZ', { day:'numeric', month:'short', year:'numeric' });
}
</script>
</body>
</html>
